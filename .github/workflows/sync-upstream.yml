name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: sabnzbd-refresh-interval-v2
  SYNC_BRANCH: upstream-sync
  UPSTREAM_REPOSITORY: gethomepage/homepage
  UPSTREAM_BRANCH: main

jobs:
  sync:
    name: Open upstream sync PR
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sabnzbd-refresh-interval-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream for new commits
        id: upstream
        shell: bash
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Patch branch already contains upstream/${UPSTREAM_BRANCH}."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has commits not present in the patch branch."
          fi

      - name: Merge upstream into sync branch
        if: steps.upstream.outputs.has_changes == 'true'
        run: |
          git switch -C "${SYNC_BRANCH}" "${TARGET_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Push sync branch
        if: steps.upstream.outputs.has_changes == 'true'
        run: git push --force origin "${SYNC_BRANCH}"

      - name: Open or reuse sync pull request
        if: steps.upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing_pr=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${SYNC_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "${existing_pr}" ]; then
            echo "Using existing PR #${existing_pr}."
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${SYNC_BRANCH}" \
              --base "${TARGET_BRANCH}" \
              --title "Sync upstream main" \
              --body "This PR brings new commits from gethomepage/homepage main into the maintained SABnzbd refresh branch. Review the diff and let the repository checks complete before merging."
          fi
